<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Isaac Colomer Casas — a walk through a CV</title>
  <meta name="description" content="Isaac Colomer Casas — software generalist and game developer. His CV as a first-person valley you walk through. Press P for the written version.">
  <link rel="icon" type="image/png" href="./images/beele.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #140f18; overflow: hidden;
                 font-family: "Space Grotesk", system-ui, -apple-system, sans-serif; color: #f6ece0; }
    #wrap { position: fixed; inset: 0; }
    canvas { width: 100%; height: 100%; display: block; background: #140f18; }

    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
               text-align: center; background: #140f18; z-index: 10; transition: opacity .6s ease; }
    #loading h1 { margin: 0; font-size: clamp(22px, 4vw, 40px); font-weight: 700; letter-spacing: .04em; }
    #loading p  { margin: 0; font-size: 13px; color: #8d7669; letter-spacing: .09em; text-transform: uppercase; }
    #bar { width: min(340px, 70vw); height: 2px; background: rgba(255,255,255,.12); overflow: hidden; margin: 0 auto; }
    #bar i { display: block; height: 100%; width: 0; background: #ff7b3d; transition: width .2s ease; }
    #loading.done { opacity: 0; pointer-events: none; }

    /* One element, two ways in: a real link for phones and for anyone who does
       not read hints, and the keyboard shortcut spelled out on it. */
    #tocv { position: fixed; top: 13px; right: 16px; z-index: 20; display: inline-flex; align-items: center;
            gap: 9px; font-size: 12.5px; letter-spacing: .07em; text-decoration: none; color: #c6ac9c;
            background: rgba(0,0,0,.34); padding: 7px 12px; border-radius: 999px; opacity: .68;
            transition: opacity .2s, color .2s; }
    #tocv:hover { opacity: 1; color: #ff7b3d; }
    #tocv kbd { font: inherit; font-weight: 700; background: rgba(255,255,255,.16); border-radius: 4px;
                padding: 1px 6px; color: #f6ece0; }
    #full { position: fixed; top: 13px; left: 16px; z-index: 20; font: inherit; font-size: 12.5px;
            letter-spacing: .07em; color: #c6ac9c; background: rgba(0,0,0,.34); border: 0; cursor: pointer;
            padding: 7px 12px; border-radius: 999px; opacity: .68; }
    #full:hover { opacity: 1; color: #ff7b3d; }

    #warn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; }
    #warn div { background: #7a2233; padding: 8px 14px; font-size: 13px; margin-top: 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

  <button id="full" type="button">fullscreen</button>
  <a id="tocv" href="./cv.html"><kbd>P</kbd> written CV</a>

  <div id="loading">
    <h1>Isaac Colomer Casas</h1>
    <p>generating the valley</p>
    <div id="bar"><i></i></div>
    <p style="font-size:12px;opacity:.7">or press <strong>P</strong> for the written CV</p>
  </div>

  <div id="warn"></div>

<script>
  // Unity WebGL captures keyboard input on the canvas, so this has to run in the
  // capture phase on window to see the key before the engine swallows it.
  window.addEventListener("keydown", function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "p" || e.key === "P") {
      e.preventDefault();
      e.stopPropagation();
      window.location.href = "./cv.html";
    }
  }, true);

  var canvas  = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var barFill = document.querySelector("#bar i");

  function unityShowBanner(msg, type) {
    var host = document.querySelector("#warn");
    var div = document.createElement("div");
    div.innerHTML = msg;
    if (type === "warning") div.style.background = "#6a5a1a";
    host.appendChild(div);
    if (type !== "error") setTimeout(function () { host.removeChild(div); }, 5000);
  }

  var buildUrl = "valley/Build";
  var config = {
    arguments: [],
    dataUrl:      buildUrl + "/WebBuild.data.unityweb",
    frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
    codeUrl:      buildUrl + "/WebBuild.wasm.unityweb",
    streamingAssetsUrl: "valley/StreamingAssets",
    companyName: "Isaac Colomer Casas",
    productName: "A walk through a CV",
    productVersion: "1.0",
    showBanner: unityShowBanner,
    // The valley is fill-rate bound; a retina-resolution buffer costs far more
    // than it shows.
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/WebBuild.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      barFill.style.width = (p * 100) + "%";
    }).then(function (unityInstance) {
      loading.classList.add("done");
      setTimeout(function () { loading.style.display = "none"; }, 700);
      document.querySelector("#full").onclick = function () { unityInstance.SetFullscreen(1); };
      canvas.focus();
    }).catch(function (message) {
      loading.querySelector("p").textContent = "could not start — press P for the written CV";
      unityShowBanner(message, "error");
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
