<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isaac Colomer Casas</title>
  <meta name="description" content="Isaac Colomer Casas — game developer and software generalist, now working on computer vision." />
  <link rel="icon" type="image/png" href="./images/beele.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ec;
      --ink: #1c1b19;
      --soft: #8a857d;
      --line: #cfc9bf;
      --fill: #e8e3db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --ink: #ece8e1;
        --soft: #8b867e;
        --line: #3a3733;
        --fill: #22201e;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .2s; }
    a:hover { border-color: var(--ink); }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(32px, 7vw, 120px);
      padding: clamp(24px, 6vw, 80px);
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Knob */
    .knob-wrap { display: grid; place-items: center; }
    .knob { width: min(100%, 460px); height: auto; overflow: visible; }

    .wedge { cursor: pointer; outline: none; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
    .wedge path { fill: transparent; stroke: var(--line); stroke-width: 1; transition: fill .4s, stroke .4s; }
    .wedge text {
      fill: var(--soft);
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 21px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      transition: fill .4s;
    }
    .wedge.is-active path { fill: var(--fill); stroke: var(--ink); }
    .wedge.is-active text { fill: var(--ink); }
    .wedge:focus-visible path { stroke: var(--ink); }

    .hub circle { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    .hub .dot { fill: var(--ink); stroke: none; }
    .hub .turn { transition: transform .6s cubic-bezier(.3,1.3,.4,1); }

    /* Panel */
    .panel { max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 8px; }
    .panel h1, .panel h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      line-height: 1.05;
      margin: 0 0 .6em;
    }
    .panel h1 { font-size: clamp(40px, 5vw, 64px); }
    .panel h2 { font-size: clamp(34px, 4vw, 48px); }
    .panel p { margin: 0 0 1em; max-width: 52ch; }
    .soft { color: var(--soft); }
    .fade { animation: fade .5s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .list { list-style: none; margin: 0; padding: 0; }
    .list li { margin-bottom: 1.4em; max-width: 52ch; }
    .list .title { font-weight: 400; }
    .list p { margin: .2em 0 0; color: var(--soft); }

    .plain { list-style: none; margin: 0; padding: 0; }
    .plain li { margin-bottom: .35em; }

    .contact a { font-family: "Instrument Serif", Georgia, serif; font-size: clamp(24px, 2.6vw, 32px); }
    .contact .plain { margin-top: 1.6em; display: flex; flex-wrap: wrap; gap: 8px 22px; }

    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; padding: 32px 16px; align-items: start; gap: 40px; }
      .panel { max-height: none; overflow: visible; }
      .knob { width: min(100%, 360px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="knob-wrap">
      <svg class="knob" viewBox="0 0 460 460" role="group" aria-label="Sections">
        <g transform="translate(230 230)">
          <g id="wedges"></g>
          <g class="hub">
            <circle r="38"></circle>
            <g class="turn" id="turn"><circle class="dot" cx="0" cy="-24" r="3.5"></circle></g>
          </g>
        </g>
      </svg>
    </div>

    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <script>
  (function () {
    "use strict";

    const WORK = [
      { title: "Medical ultrasound platform", desc: "Real-time imaging tools for clinical review and model validation, at Mindsight." },
      { title: "Màscares & Marquesos", desc: "A VR experience for Quest 2, commissioned by the Generalitat de Catalunya.", url: "https://github.com/Makinilla-maker/Giravolt2023" },
      { title: "Final degree work", desc: "A first-person walking simulator in Unreal Engine 5, told through its environment.", url: "https://www.youtube.com/watch?v=aa2Q2_MgMjY" },
      { title: "Lights Out", desc: "A game jam entry. Programming and bug fixing.", url: "https://osvak.itch.io/lights-out" },
      { title: "Dune Fremen's Rising", desc: "Level design and creative direction, in a student-made engine.", url: "https://shorturl.at/hqtAC" },
      { title: "Summer Game", desc: "A small week-long piece about mood and atmosphere.", url: "https://isaacolomer.itch.io/summer-game" },
    ];

    const JOBS = [
      { role: "Software Developer", org: "Mindsight Ventures", year: "2025 – now", desc: "Data-driven features and automation tools, mostly in Python." },
      { role: "Software Developer Intern", org: "Mindsight Ventures", year: "2025", desc: "Research prototypes, internal tools and test environments." },
      { role: "Test Engineer", org: "GLI", year: "2023 – 2024", desc: "Software validation and compliance, with teams around the world." },
      { role: "Teacher & Mentor", org: "Innvideogames", year: "2021", desc: "Taught programming, Unity and game design." },
    ];

    const INTRO = `
      <h1>Isaac Colomer Casas</h1>
      <p class="soft">Game developer and software generalist, now working on computer vision.</p>`;

    const SECTIONS = [
      { label: "About", html: `
        <h2>About</h2>
        <p>I make software and games. I started in C, C++ and C#, building with Unity and Unreal,
           and now work on computer vision and automation at Mindsight Ventures.</p>
        <p>Games taught me to make things that feel good and run fast. Testing taught me to make them reliable.
           I like owning something from the first prototype to the last bit of polish.</p>` },

      { label: "Skills", html: `
        <h2>Skills</h2>
        <ul class="plain">
          <li>Gameplay programming</li>
          <li>C, C++, C# and Python</li>
          <li>Unity and Unreal Engine</li>
          <li>Computer vision and automation</li>
          <li>Game and level design</li>
          <li>Testing and validation</li>
          <li>Interactive web</li>
        </ul>` },

      { label: "Work", html: `
        <h2>Work</h2>
        <ul class="list">${WORK.map((w) => `
          <li>
            <span class="title">${w.url ? `<a href="${w.url}" target="_blank" rel="noopener">${w.title}</a>` : w.title}</span>
            <p>${w.desc}</p>
          </li>`).join("")}
        </ul>` },

      { label: "Experience", html: `
        <h2>Experience</h2>
        <ul class="list">${JOBS.map((j) => `
          <li>
            <span class="title">${j.role}, ${j.org}</span> <span class="soft">· ${j.year}</span>
            <p>${j.desc}</p>
          </li>`).join("")}
        </ul>` },

      { label: "Contact", html: `
        <div class="contact">
          <h2>Say hello</h2>
          <a href="mailto:isaacolomer@gmail.com">isaacolomer@gmail.com</a>
          <ul class="plain">
            <li><a href="https://github.com/IsaaColomer" target="_blank" rel="noopener">GitHub</a></li>
            <li><a href="https://www.linkedin.com/in/isaac-colomer-casas-4a8a41206/" target="_blank" rel="noopener">LinkedIn</a></li>
            <li><a href="https://isaacolomer.itch.io" target="_blank" rel="noopener">itch.io</a></li>
            <li><a href="https://twitter.com/IsaacColomerC1" target="_blank" rel="noopener">Twitter</a></li>
          </ul>
        </div>` },
    ];

    /* Geometry */
    const NS = "http://www.w3.org/2000/svg";
    const R_OUT = 200, R_IN = 52, GAP = 5;
    const N = SECTIONS.length, STEP = 360 / N;
    const rad = (d) => (d - 90) * Math.PI / 180;
    const pt = (r, d) => [r * Math.cos(rad(d)), r * Math.sin(rad(d))];

    function wedgePath(a0, a1) {
      const go = (GAP / R_OUT) * 180 / Math.PI, gi = (GAP / R_IN) * 180 / Math.PI;
      const [x0, y0] = pt(R_IN, a0 + gi), [x1, y1] = pt(R_OUT, a0 + go);
      const [x2, y2] = pt(R_OUT, a1 - go), [x3, y3] = pt(R_IN, a1 - gi);
      return `M${x0} ${y0} L${x1} ${y1} A${R_OUT} ${R_OUT} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${R_IN} ${R_IN} 0 0 0 ${x0} ${y0}Z`;
    }

    const wedgesG = document.getElementById("wedges");
    const turn = document.getElementById("turn");
    const panel = document.getElementById("panel");
    let active = null, angle = 0;

    function render(html) {
      panel.innerHTML = `<div class="fade">${html}</div>`;
      panel.scrollTop = 0;
    }

    function activate(i) {
      if (active === i) return;
      [...wedgesG.children].forEach((w, j) => {
        const on = j === i;
        w.classList.toggle("is-active", on);
        w.setAttribute("aria-pressed", on);
        const [dx, dy] = pt(on ? 8 : 0, j * STEP + STEP / 2);
        w.style.transform = `translate(${dx}px, ${dy}px)`;
      });
      active = i;
      const target = i * STEP + STEP / 2;
      angle += ((target - angle) % 360 + 540) % 360 - 180; // shortest way round
      turn.style.transform = `rotate(${angle}deg)`;
      render(SECTIONS[i].html);
    }

    SECTIONS.forEach((s, i) => {
      const mid = i * STEP + STEP / 2;
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "wedge");
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", s.label);

      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", wedgePath(i * STEP, (i + 1) * STEP));
      const [tx, ty] = pt((R_IN + R_OUT) / 2 + 12, mid);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", tx); t.setAttribute("y", ty);
      t.textContent = s.label;
      g.append(p, t);

      g.addEventListener("mouseenter", () => activate(i));
      g.addEventListener("click", () => activate(i));
      g.addEventListener("focus", () => activate(i));
      g.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); wedgesG.children[(i + 1) % N].focus(); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); wedgesG.children[(i - 1 + N) % N].focus(); }
      });
      wedgesG.appendChild(g);
    });

    render(INTRO);
  })();
  </script>
</body>
</html>
