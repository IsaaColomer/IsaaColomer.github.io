<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A walk through a CV — Isaac Colomer Casas</title>
  <meta name="description" content="A first-person exploration piece where Isaac Colomer Casas's CV is a valley you walk through. Built in Unity; every tree, hill and sound is generated at load.">
  <link rel="icon" type="image/png" href="../images/beele.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #140f18; overflow: hidden;
                 font-family: "Space Grotesk", system-ui, -apple-system, sans-serif; color: #f6ece0; }
    #wrap { position: fixed; inset: 0; }
    canvas { width: 100%; height: 100%; display: block; background: #140f18; }

    /* loading */
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
               text-align: center; background: #140f18; z-index: 10; transition: opacity .6s ease; }
    #loading h1 { margin: 0; font-size: clamp(22px, 4vw, 40px); font-weight: 700; letter-spacing: .04em; }
    #loading p  { margin: 0; font-size: 14px; color: #8d7669; letter-spacing: .08em; text-transform: uppercase; }
    #bar { width: min(340px, 70vw); height: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: #ff7b3d; transition: width .2s ease; }
    #loading.done { opacity: 0; pointer-events: none; }

    /* chrome */
    #back { position: fixed; top: 14px; left: 16px; z-index: 20; font-size: 13px; letter-spacing: .06em;
            color: #c6ac9c; text-decoration: none; opacity: .55; transition: opacity .2s; }
    #back:hover { opacity: 1; color: #ff7b3d; }
    #full { position: fixed; top: 12px; right: 16px; z-index: 20; font-size: 13px; letter-spacing: .06em;
            color: #c6ac9c; background: none; border: 0; cursor: pointer; opacity: .55; }
    #full:hover { opacity: 1; color: #ff7b3d; }

    #warn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; }
    #warn div { background: #7a2233; padding: 8px 14px; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

  <a id="back" href="../">← back to the CV</a>
  <button id="full" type="button">fullscreen</button>

  <div id="loading">
    <h1>A walk through a CV</h1>
    <p>generating the valley</p>
    <div id="bar"><i></i></div>
  </div>

  <div id="warn"></div>

<script>
  var canvas  = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var barFill = document.querySelector("#bar i");

  function unityShowBanner(msg, type) {
    var host = document.querySelector("#warn");
    var div = document.createElement("div");
    div.innerHTML = msg;
    if (type === "warning") div.style.background = "#6a5a1a";
    host.appendChild(div);
    if (type !== "error") setTimeout(function () { host.removeChild(div); }, 5000);
  }

  var buildUrl = "Build";
  var config = {
    arguments: [],
    dataUrl:      buildUrl + "/WebBuild.data.unityweb",
    frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
    codeUrl:      buildUrl + "/WebBuild.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Isaac Colomer Casas",
    productName: "A walk through a CV",
    productVersion: "1.0",
    showBanner: unityShowBanner,
    // Cap the render target on high-DPI screens: the valley is fill-rate bound
    // and a retina-resolution buffer costs far more than it shows.
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/WebBuild.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      barFill.style.width = (p * 100) + "%";
    }).then(function (unityInstance) {
      loading.classList.add("done");
      setTimeout(function () { loading.style.display = "none"; }, 700);
      document.querySelector("#full").onclick = function () { unityInstance.SetFullscreen(1); };
      canvas.focus();
    }).catch(function (message) {
      loading.querySelector("p").textContent = "could not start";
      unityShowBanner(message, "error");
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
